name: Publish API reference

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  publish:
    if: vars.PUBLISH_PAGES == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify reference matches OpenAPI
        run: |
          ./scripts/build.sh
          git diff --exit-code -- docs/reference/API.md site/openapi.yaml
          python3 -m unittest discover -s tests -v
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
